  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;input class=&quot;form-range&quot; id=&quot;gpv-speed&quot; type=&quot;range&quot; min=&quot;0.25&quot; max=&quot;2.5&quot; value=&quot;1&quot; step=&quot;0.25&quot;&gt;
    &lt;/label&gt;

    &lt;span&gt;&lt;i class=&quot;gpv-swatch gpv-vlow&quot;&gt;&lt;/i&gt;Very low &amp;lt;50&lt;/span&gt;

&lt;style&gt;
  #generic-protein-viewer { width: 100%; color: var(--foreground); }
  #generic-protein-viewer .viz-controls { margin-bottom: 12px; align-items: end; }
  #generic-protein-viewer .form-label { min-width: 126px; flex: 1 1 138px; }

  #generic-protein-viewer .gpv-entry .form-control-color { flex: 0 0 auto; }

  #generic-protein-viewer .gpv-vlow { background: #ff7d45; }
  #generic-protein-viewer .gpv-low { background: #ffdb13; }
  #generic-protein-viewer .gpv-confident { background: #65cbf3; }
  #generic-protein-viewer .gpv-vhigh { background: #0053d6; }
  #generic-protein-viewer .gpv-stage { position: relative; width: 100%; height: 520px; min-height: 360px; background: color-mix(in srgb, var(--muted) 35%, transparent); overflow: hidden; }
  #generic-protein-viewer .gpv-stage canvas { display: block; }

&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol-min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;generic-protein-viewer&#x27;);
  const viewer = $3Dmol.createViewer(root.querySelector(&#x27;#gpv-stage&#x27;), {
    backgroundColor: &#x27;rgba(0,0,0,0)&#x27;,
    antialias: true
  });
  const palette = [&#x27;#8b5cf6&#x27;, &#x27;#06b6d4&#x27;, &#x27;#f97316&#x27;, &#x27;#22c55e&#x27;, &#x27;#ec4899&#x27;, &#x27;#eab308&#x27;, &#x27;#3b82f6&#x27;, &#x27;#ef4444&#x27;];
  let structures = [];
  let animationFrame = 0;
  let rockPhase = 0;
  let rockDirection = 1;

  function plddtColor(score) {
    if (score &lt; 50) return &#x27;#ff7d45&#x27;;
    if (score &lt; 70) return &#x27;#ffdb13&#x27;;
    if (score &lt; 90) return &#x27;#65cbf3&#x27;;
    return &#x27;#0053d6&#x27;;
  }

  function modelScores(model) {
    const scores = [];
    model.selectedAtoms({}).forEach(atom =&gt; {
      const score = Number(atom.b);
      if (atom.atom === &#x27;CA&#x27; &amp;&amp; Number.isFinite(score)) scores.push(score);
    });
    return scores;
  }

  function mean(values) {
    return values.length ? values.reduce((sum, value) =&gt; sum + value, 0) / values.length : null;
  }

  function styleFor(entry) {
    const representation = root.querySelector(&#x27;#gpv-style&#x27;).value;
    const mode = root.querySelector(&#x27;#gpv-color-mode&#x27;).value;
    const style = {};
    let options = { color: entry.color };
    if (mode === &#x27;chain&#x27;) options = { colorscheme: &#x27;chainHetatm&#x27; };
    if (mode === &#x27;plddt&#x27;) options = { colorfunc: atom =&gt; plddtColor(Number(atom.b || 0)) };
    if (mode === &#x27;spectrum&#x27;) options = { colorscheme: &#x27;spectrum&#x27; };
    if (mode === &#x27;element&#x27;) options = { colorscheme: &#x27;default&#x27; };
    if (representation === &#x27;line&#x27;) options.linewidth = 2;
    style[representation] = options;
    return style;
  }

  function updateStatus(message = &#x27;Ready&#x27;) {
    const visible = structures.filter(entry =&gt; entry.visible);
    root.querySelector(&#x27;#gpv-count&#x27;).textContent = visible.length + &#x27; visible / &#x27; + structures.length + &#x27; loaded&#x27;;
    const scores = visible.flatMap(entry =&gt; entry.scores);
    const score = mean(scores);
    root.querySelector(&#x27;#gpv-confidence&#x27;).textContent = score === null ? &#x27;Mean pLDDT —&#x27; : &#x27;Mean pLDDT &#x27; + score.toFixed(1);
    root.querySelector(&#x27;#gpv-state&#x27;).textContent = message;
    root.querySelector(&#x27;#gpv-empty&#x27;).hidden = structures.length &gt; 0;
    root.querySelector(&#x27;#gpv-report&#x27;).disabled = structures.length === 0;
  }

  function applyStyle() {
    structures.forEach(entry =&gt; {
      entry.model.setStyle({}, {});
      if (entry.visible) entry.model.setStyle({}, styleFor(entry));
    });
    root.querySelector(&#x27;#gpv-plddt-legend&#x27;).hidden = root.querySelector(&#x27;#gpv-color-mode&#x27;).value !== &#x27;plddt&#x27;;
    viewer.render();
    updateStatus();
  }

  function renderList() {
    const list = root.querySelector(&#x27;#gpv-list&#x27;);
    list.replaceChildren();
    structures.forEach(entry =&gt; {
      const row = document.createElement(&#x27;div&#x27;);
      row.className = &#x27;gpv-entry&#x27;;

      const visibleLabel = document.createElement(&#x27;label&#x27;);
      visibleLabel.className = &#x27;form-check form-switch&#x27;;
      const visible = document.createElement(&#x27;input&#x27;);
      visible.className = &#x27;form-check-input&#x27;;
      visible.type = &#x27;checkbox&#x27;;
      visible.checked = entry.visible;
      visible.setAttribute(&#x27;aria-label&#x27;, &#x27;Show &#x27; + entry.name);
      visible.addEventListener(&#x27;change&#x27;, () =&gt; { entry.visible = visible.checked; applyStyle(); });
      visibleLabel.append(visible);

      const name = document.createElement(&#x27;span&#x27;);
      name.className = &#x27;gpv-entry-name&#x27;;
      name.textContent = entry.name;

      const score = document.createElement(&#x27;span&#x27;);
      score.className = &#x27;gpv-entry-score text-small&#x27;;
      const average = mean(entry.scores);
      score.textContent = average === null ? &#x27;pLDDT —&#x27; : average.toFixed(1);

      const color = document.createElement(&#x27;input&#x27;);
      color.className = &#x27;form-control form-control-color&#x27;;
      color.type = &#x27;color&#x27;;
      color.value = entry.color;
      color.setAttribute(&#x27;aria-label&#x27;, &#x27;Color for &#x27; + entry.name);
      color.addEventListener(&#x27;input&#x27;, () =&gt; { entry.color = color.value; root.querySelector(&#x27;#gpv-color-mode&#x27;).value = &#x27;structure&#x27;; applyStyle(); });

      const remove = document.createElement(&#x27;button&#x27;);
      remove.className = &#x27;btn btn-ghost&#x27;;
      remove.type = &#x27;button&#x27;;
      remove.textContent = &#x27;Remove&#x27;;
      remove.addEventListener(&#x27;click&#x27;, () =&gt; {
        viewer.removeModel(entry.model);
        structures = structures.filter(item =&gt; item !== entry);
        renderList();
        applyStyle();
      });

      row.append(visibleLabel, name, score, color, remove);
      list.append(row);
    });
  }

  function addStructure(name, text, format) {
    const model = viewer.addModel(text, format);
    structures.push({
      name,
      model,
      visible: true,
      color: palette[structures.length % palette.length],
      text,
      format,
      scores: modelScores(model)
    });
  }

  async function loadFiles(files) {
    if (!files.length) return;
    updateStatus(&#x27;Loading…&#x27;);
    let loaded = 0;
    let skipped = 0;
    for (const file of files) {
      try {
        const extension = file.name.split(&#x27;.&#x27;).pop().toLowerCase();
        if (extension === &#x27;zip&#x27;) {
          const zip = await JSZip.loadAsync(file);
          const members = Object.values(zip.files).filter(member =&gt; {
            const lower = member.name.toLowerCase();
            const supported = lower.endsWith(&#x27;.pdb&#x27;) || lower.endsWith(&#x27;.cif&#x27;) || lower.endsWith(&#x27;.mmcif&#x27;);
            return !member.dir &amp;&amp; supported &amp;&amp; !lower.includes(&#x27;/templates/&#x27;) &amp;&amp; !lower.includes(&#x27;template_hit&#x27;);
          });
          for (const member of members) {
            const memberExtension = member.name.split(&#x27;.&#x27;).pop().toLowerCase();
            addStructure(member.name.split(&#x27;/&#x27;).pop(), await member.async(&#x27;string&#x27;), memberExtension === &#x27;pdb&#x27; ? &#x27;pdb&#x27; : &#x27;cif&#x27;);
            loaded += 1;
            updateStatus(&#x27;Loading &#x27; + loaded + &#x27; structures…&#x27;);
          }
          if (!members.length) skipped += 1;
        } else if ([&#x27;pdb&#x27;, &#x27;cif&#x27;, &#x27;mmcif&#x27;].includes(extension)) {
          addStructure(file.name, await file.text(), extension === &#x27;pdb&#x27; ? &#x27;pdb&#x27; : &#x27;cif&#x27;);
          loaded += 1;
        } else {
          skipped += 1;
        }
      } catch (error) {
        skipped += 1;
      }
    }
    renderList();
    applyStyle();
    if (loaded) viewer.zoomTo();
    viewer.render();
    root.querySelector(&#x27;#gpv-files&#x27;).value = &#x27;&#x27;;
    updateStatus(loaded ? &#x27;Loaded &#x27; + loaded + (skipped ? &#x27; · skipped &#x27; + skipped : &#x27;&#x27;) : &#x27;No supported structures found&#x27;);
  }

  function stopMotion() {
    viewer.spin(false);
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
  }

  function startRock() {
    const tick = () =&gt; {
      const speed = Number(root.querySelector(&#x27;#gpv-speed&#x27;).value);
      const delta = 0.32 * speed * rockDirection;
      viewer.rotate(delta, &#x27;y&#x27;);
      viewer.render();
      rockPhase += Math.abs(delta);
      if (rockPhase &gt;= 24) { rockPhase = 0; rockDirection *= -1; }
      animationFrame = requestAnimationFrame(tick);
    };
    tick();
  }

  function applyMotion() {
    stopMotion();
    const motion = root.querySelector(&#x27;#gpv-motion&#x27;).value;
    const speed = Number(root.querySelector(&#x27;#gpv-speed&#x27;).value);
    if (motion === &#x27;spin&#x27;) viewer.spin(&#x27;y&#x27;, 0.7 * speed);
    if (motion === &#x27;rock&#x27;) startRock();
    updateStatus(motion === &#x27;off&#x27; ? &#x27;Ready&#x27; : root.querySelector(&#x27;#gpv-motion&#x27;).selectedOptions[0].text);
  }

  function downloadReport() {
    const exported = structures.map(entry =&gt; ({
      name: entry.name,
      text: entry.text,
      format: entry.format,
      color: entry.color
    }));
    const payload = JSON.stringify(exported).replace(/&lt;/g, &#x27;\\u003c&#x27;);
    const html = [
      &quot;&lt;!doctype html&gt;&quot;,
      &quot;&lt;html lang=&#x27;en&#x27;&gt;&lt;head&gt;&lt;meta charset=&#x27;utf-8&#x27;&gt;&quot;,
      &quot;&lt;meta name=&#x27;viewport&#x27; content=&#x27;width=device-width,initial-scale=1&#x27;&gt;&quot;,
      &quot;&lt;title&gt;Protein Model Report&lt;/title&gt;&quot;,
      &quot;&lt;style&gt;&quot;,
      &quot;:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:18px;background:#111827;color:#f8fafc}main{max-width:1100px;margin:auto}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}label{display:grid;gap:4px}button,select,input{font:inherit;padding:7px 10px}#view{height:70vh;min-height:420px;background:#020617}#status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;color:#cbd5e1}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:12px;height:12px;display:inline-block}.vlow{background:#ff7d45}.low{background:#ffdb13}.conf{background:#65cbf3}.vhigh{background:#0053d6}@media(prefers-color-scheme:light){body{background:#f8fafc;color:#0f172a}#view{background:#e2e8f0}#status{color:#475569}}&quot;,
      &quot;&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&quot;,

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),

      .then(({ x, y }) =&gt; {

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

        }

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;

    }

(() => {
  /* Accessible hover/focus tooltips for [data-tooltip] elements. */
  const openDelay = 450;
  const tip = document.createElement('div');
  tip.className = 'tooltip';
  tip.id = 'gpv-tooltip';
  tip.setAttribute('role', 'tooltip');
  let current = null;
  let timer = 0;

  const place = () => {
    if (!current) return;
    const anchor = current.getBoundingClientRect();
    const gap = 6;
    tip.style.maxWidth = Math.min(280, window.innerWidth - 16) + 'px';
    const box = tip.getBoundingClientRect();
    let top = anchor.top - box.height - gap;
    if (top < 4) top = Math.min(anchor.bottom + gap, window.innerHeight - box.height - 4);
    let left = anchor.left + anchor.width / 2 - box.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - box.width - 8));
    tip.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(top) + 'px)';
    tip.style.visibility = 'visible';
  };

  const hide = () => {
    clearTimeout(timer);
    timer = 0;
    if (current) current.removeAttribute('aria-describedby');
    current = null;
    tip.remove();
  };

  const show = element => {
    const text = (element.getAttribute('data-tooltip') || '').trim();
    if (!text || !element.isConnected) return;
    hide();
    current = element;
    tip.textContent = text;
    tip.style.visibility = 'hidden';
    tip.style.transform = 'translate(0,0)';
    document.body.append(tip);
    element.setAttribute('aria-describedby', tip.id);

    const element = trigger(event.target);

    const element = trigger(event.target);
    if (element && (element === current || timer)) hide();

    const element = trigger(event.target);
    if (element && element.matches(':focus-visible')) show(element);
